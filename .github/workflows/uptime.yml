# Uptime check for Parça. Lives in its own small PUBLIC repo (moved here from
# vallanders-dev/Parcaplay.com on 2026-10-02) so the site repo can be private:
# public repos run Actions for free, and this runs up to 144 times a day.
# Every 10 minutes: the companion server (api.parcaplay.com) and the website.
# A failure is retried twice, 30 s apart, so one slow answer isn't an alarm.
# When something goes DOWN: opens an issue titled "[uptime] ..." and fails
# this run, which makes GitHub email the repo owner - once per outage, not
# every 10 minutes. When it's back UP: comments and closes the issue.
# Keepalive: GitHub switches off scheduled workflows in a public repo after
# 60 days without commits, so once a month this run commits a timestamp.
name: Uptime check

on:
  schedule:
    - cron: "*/10 * * * *"
    - cron: "7 12 1 * *"   # monthly keepalive (see top)
  workflow_dispatch:
    inputs:
      simulate_down:
        description: "Test the alert: pretend the server is down (opens the issue, emails the owner)"
        type: boolean
        default: false
      keepalive:
        description: "Test the monthly keepalive commit now"
        type: boolean
        default: false

permissions:
  issues: write
  contents: write   # keepalive commit only

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check the server and the site
        id: probe
        run: |
          check() {  # name, url, text the page must contain
            for attempt in 1 2 3; do
              body=$(curl -sSL --max-time 15 "$2" 2>&1) && echo "$body" | grep -q "$3" && return 0
              [ $attempt -lt 3 ] && sleep 30
            done
            echo "$1 is DOWN ($2): ${body:0:200}" >> down.txt
          }
          check "Companion server" "https://api.parcaplay.com/v1/health" '"ok"'
          check "Website" "https://parcaplay.com/" "Parça"
          if [ "${{ inputs.simulate_down }}" = "true" ]; then
            echo "Companion server is DOWN (SIMULATED - manual alert test, nothing is really down)" >> down.txt
          fi
          if [ -s down.txt ]; then
            cat down.txt
            { echo "down<<EOF"; cat down.txt; echo "EOF"; } >> "$GITHUB_OUTPUT"
          else
            echo "all up"
          fi

      - name: Open or close the outage issue
        env:
          DOWN: ${{ steps.probe.outputs.down }}
        run: |
          open=$(gh issue list --state open --limit 50 --json number,title \
                 --jq '[.[] | select(.title | startswith("[uptime]"))][0].number // empty')
          now=$(TZ=America/Sao_Paulo date '+%Y-%m-%d %H:%M (Brasília)')
          if [ -n "$DOWN" ]; then
            if [ -z "$open" ]; then
              printf 'Detected %s.\n\n```\n%s\n```\n\nThis issue closes by itself when the check passes again.\n' \
                "$now" "$DOWN" > body.md
              gh issue create --title "[uptime] Parça is down" --body-file body.md
              exit 1   # the failed run is what emails the owner
            fi
            echo "still down - issue #$open already open"
          elif [ -n "$open" ]; then
            gh issue comment "$open" --body "Back up at $now."
            gh issue close "$open"
          fi

      - name: Monthly keepalive commit
        if: github.event.schedule == '7 12 1 * *' || inputs.keepalive
        run: |
          git clone -q --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" repo
          cd repo
          date -u '+%Y-%m-%dT%H:%MZ' > keepalive.txt
          git add keepalive.txt
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com"             commit -q -m "keepalive" && git push -q
